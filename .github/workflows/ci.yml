name: CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --only-binary :all: --require-hashes -r backend/requirements.txt

      # Este paso corre un archivo que el paso siguiente vuelve a correr dentro de la suite
      # completa, y la redundancia es deliberada: no la quites.
      #
      # Que el contrato de `docs/contrato/openapi.json` siga describiendo a la API es una
      # promesa hacia afuera, no una prueba unitaria mas. Aislarla le da dos cosas que
      # `pytest -v` no da: aparece con nombre propio en la lista de pasos del run, asi que
      # cuando un cambio rompe el contrato se ve cual fallo sin abrir el log; y corre antes
      # que el resto, de modo que un contrato desincronizado corta el pipeline en dos
      # segundos en vez de al final.
      - name: Prueba de contrato (OpenAPI)
        run: pytest -v tests/test_contrato.py
        working-directory: backend

      - name: Suite completa del backend
        run: pytest -v
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Fijada a la misma version con la que se genero pubspec.lock. Con `channel: stable`
          # a secas, cada release de Flutter cambia los paquetes que el SDK fija (matcher, meta,
          # test_api, vector_math) y --enforce-lockfile falla aunque nadie toque el pubspec.
          flutter-version: "3.44.3"
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
