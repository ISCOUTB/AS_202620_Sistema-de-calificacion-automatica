name: CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --only-binary :all: --require-hashes -r backend/requirements.txt

      # Este paso corre un archivo que el paso siguiente vuelve a correr dentro de la suite
      # completa, y la redundancia es deliberada: no la quites.
      #
      # Que el contrato de `docs/contrato/openapi.json` siga describiendo a la API es una
      # promesa hacia afuera, no una prueba unitaria mas. Aislarla le da dos cosas que
      # `pytest -v` no da: aparece con nombre propio en la lista de pasos del run, asi que
      # cuando un cambio rompe el contrato se ve cual fallo sin abrir el log; y corre antes
      # que el resto, de modo que un contrato desincronizado corta el pipeline en dos
      # segundos en vez de al final.
      - name: Prueba de contrato (OpenAPI)
        run: pytest -v tests/test_contrato.py
        working-directory: backend

      # Mismo criterio que el paso anterior, para el escenario del segundo corte (EC-09,
      # ADR-0015): que la ruta pública de distractores no pueda gastar la cuota del proveedor de
      # LLM sin límite es una promesa de operación, y con nombre propio en la lista de pasos se ve
      # sin abrir el log si un cambio la rompió. La suite completa la vuelve a correr.
      - name: Escenario del segundo corte (presupuesto del proveedor de LLM)
        run: pytest -v tests/test_presupuesto.py tests/test_ruta_distractores.py
        working-directory: backend

      # Mismo criterio, para los modos de fallo de la S11 (ADR-0016): que las integraciones
      # aguanten que el otro lado no responda, responda tarde o responda dos veces es la tabla de
      # `docs/evidencia/modos-de-fallo.md` hecha prueba. La suite completa la vuelve a correr.
      - name: Modos de fallo de las integraciones (S11)
        run: >-
          pytest -v tests/test_modos_de_fallo.py tests/test_durabilidad_recepcion.py
          tests/test_proveedor_llm.py tests/test_ruta_distractores.py
        working-directory: backend

      # Mismo criterio, para el taller de mensajería (ADR-0020): que el mensaje de la cola cumpla
      # su contrato versionado, que un duplicado se procese una sola vez y que un fallo
      # recuperable se reintente es la promesa de la cola hacia el worker. La suite completa la
      # vuelve a correr.
      - name: Taller de mensajería (contrato, duplicados y reintentos)
        run: pytest -v tests/test_mensajeria.py
        working-directory: backend

      - name: Suite completa del backend
        run: pytest -v
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Fijada a la misma version con la que se genero pubspec.lock. Con `channel: stable`
          # a secas, cada release de Flutter cambia los paquetes que el SDK fija (matcher, meta,
          # test_api, vector_math) y --enforce-lockfile falla aunque nadie toque el pubspec.
          flutter-version: "3.44.3"
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test

  # Publica en la rama `despliegue` lo que pasó las pruebas, y esa rama es la que lee el servidor
  # del laboratorio (deploy/compose.lab.yaml). Es la sección 3.6 del manual del servidor sin el
  # merge a mano: el servidor solo recibe un commit de `master` cuyo CI terminó en verde, como hacía
  # Render con `autoDeployTrigger: checksPass`. La rama es `master` más un commit con el sitio
  # compilado, porque Flutter no se compila en el servidor (deploy/sitio/Dockerfile).
  #
  # El push lo hace el GITHUB_TOKEN, y GitHub no dispara workflows por un push de ese token: el CI
  # no vuelve a correr sobre `despliegue`, pero el panel del servidor sí recibe el aviso.
  publicar-despliegue:
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Con dos push seguidos, el más reciente cancela al anterior: solo importa la punta.
    concurrency:
      group: publicar-despliegue
      cancel-in-progress: true
    env:
      # La URL de la API que se hornea en el sitio. Si cambia el dominio de la API en el panel,
      # cambia aquí y en ALLOWED_ORIGIN.
      BACKEND_URL: https://api-calificacion.iscoutb.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.3"
          channel: stable
      - name: Compilar el sitio
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --no-pub --dart-define=BACKEND_URL="$BACKEND_URL"
          # Un sitio que llama a otra API carga igual y no avisa de nada: si la URL no quedó
          # horneada, el job falla aquí y no se publica.
          grep -q -F "$BACKEND_URL" build/web/main.dart.js
      - name: Publicar la rama despliegue
        run: |
          # Si `master` avanzó mientras corría el CI, este commit ya no es el último: lo publica la
          # corrida del commit nuevo, y esta no la pisa.
          git fetch --depth 1 origin master
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "master ya no está en $GITHUB_SHA: no se publica."
            exit 0
          fi
          # Con `/.` se copia el contenido: la carpeta ya existe, con su `.gitkeep`.
          cp -r frontend/build/web/. deploy/sitio/web/
          # Qué commit de master está desplegado: https://calificacion.iscoutb.dev/revision.txt
          echo "$GITHUB_SHA" > deploy/sitio/web/revision.txt
          # Que SonarCloud no analice el JavaScript compilado de esta rama.
          echo "sonar.exclusions=deploy/sitio/web/**" > .sonarcloud.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B despliegue
          git add -f deploy/sitio/web .sonarcloud.properties
          git commit -q -m "despliegue: master en ${GITHUB_SHA::7}" \
            -m "Sitio compilado con BACKEND_URL=$BACKEND_URL en la corrida $GITHUB_RUN_ID."
          git push --force origin despliegue
