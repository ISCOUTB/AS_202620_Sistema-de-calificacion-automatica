services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-omr}
    volumes:
      - datos_postgres:/var/lib/postgresql/data

  api:
    build: &backend-build
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/omr}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
    volumes:
      - almacen_imagenes:/app/almacen_imagenes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started

  worker:
    build: *backend-build
    command: python -m worker.main
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/omr}
    volumes:
      - almacen_imagenes:/app/almacen_imagenes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  datos_postgres:
  almacen_imagenes:
