services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-omr}
    volumes:
      - datos_postgres:/var/lib/postgresql/data

  api:
    build: &backend-build
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/omr}
      RUTA_ALMACEN: ${RUTA_ALMACEN:-/app/almacen_imagenes}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      # Nombre de la cola: el mismo valor que lee `worker`, abajo. Si se cambia aquí y no
      # allá, `api` encola en una lista y `worker` escucha otra.
      NOMBRE_COLA: ${NOMBRE_COLA:-procesamiento}
      # Bitácora de recepción (ADR-0006). Solo `api` la escribe. El código deriva esta ruta
      # de RUTA_ALMACEN; aquí son dos literales, así que se cambian juntas.
      RUTA_BITACORA: ${RUTA_BITACORA:-/app/almacen_imagenes/bitacora-de-recepcion.jsonl}
    volumes:
      - almacen_imagenes:/app/almacen_imagenes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started

  worker:
    build: *backend-build
    command: python -m worker.main
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/omr}
      RUTA_ALMACEN: ${RUTA_ALMACEN:-/app/almacen_imagenes}
      # El mismo valor que lee `api`, arriba. RUTA_BITACORA no va aquí: `worker/main.py` no
      # la lee, y declarar una variable que el servicio ignora es configuración muerta.
      NOMBRE_COLA: ${NOMBRE_COLA:-procesamiento}
    volumes:
      - almacen_imagenes:/app/almacen_imagenes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  datos_postgres:
  almacen_imagenes:
